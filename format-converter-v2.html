<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>谷歌账号格式转换器</title>
    <meta name="description" content="100%本地运行的谷歌账号格式批量转换工具，支持多种分隔符智能识别，隐私安全有保障">
    
    <style>
        :root {
            /* Apple Light Mode Palette */
            --bg-color: #f5f5f7; /* Classic Apple light grey background */
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-active: #0071e3; /* Apple Blue */
            
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-dim: #a1a1a6;
            
            --accent: #0071e3;
            --accent-hover: #0077ED;
            --success: #34c759; /* Apple Green */
            --warning: #ff9f0a; /* Apple Orange */
            --danger: #ff3b30;  /* Apple Red */
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            /* Apple standard font stack */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 1.5rem 1rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* ─── Header ─── */
        header {
            text-align: center;
            padding: 1rem 0 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: var(--shadow-sm);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 0.5rem;
        }
        .logo-icon .icon { font-size: 1.55rem; color: var(--accent); }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-style: normal;
            font-weight: 700;
        }

        h1 {
            font-size: 1.4rem; font-weight: 700; letter-spacing: -0.015em;
            color: var(--text-primary);
        }
        .subtitle { font-size: 0.85rem; color: var(--text-secondary); }

        /* ─── Nav Link ─── */
        .nav-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--accent); text-decoration: none;
            font-size: 0.85rem; font-weight: 500;
            padding: 0.5rem 1rem;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }
        .nav-link:active { background: #f5f5f7; transform: scale(0.97); }

        /* ─── Apple Style Cards ─── */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex; flex-direction: column; gap: 0.8rem;
            box-shadow: var(--shadow-md);
            transition: box-shadow 0.3s ease;
        }
        
        /* ─── Section Title ─── */
        .section-title {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.95rem; font-weight: 600;
            color: var(--text-primary);
        }
        .section-title .label {
            display: flex; align-items: center; gap: 0.5rem;
        }
        
        .mode-badge {
            font-size: 0.75rem; font-weight: 600;
            background: #f0f8ff; /* Light blue tint */
            padding: 0.25rem 0.7rem; border-radius: 20px;
            color: var(--accent);
            display: flex; align-items: center; gap: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .mode-badge.show { opacity: 1; }

        /* ─── Textarea Wrappers ─── */
        .input-wrapper, .output-wrapper {
            position: relative;
            width: 100%;
        }

        textarea {
            width: 100%;
            background: #fbfbfd; /* Extremely light grey, almost white */
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-primary);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
        }
        #inputText { height: 140px; }
        #outputText { height: 180px; padding-right: 7.5rem; }
        
        textarea:focus {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15); /* Apple focus ring */
        }
        textarea::placeholder { color: #c1c1c6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

        /* ─── Floating Actions ─── */
        .clear-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: #e5e5ea;
            border: none; border-radius: 50%;
            color: var(--text-secondary);
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
            font-size: 0.8rem;
        }
        .clear-btn:active { transform: scale(0.9); background: #d1d1d6; }

        .floating-copy-btn {
            position: absolute;
            bottom: 12px; right: 12px;
            background: var(--accent);
            border: none; border-radius: 999px;
            color: white;
            min-width: 92px; height: 40px;
            padding: 0 14px;
            display: flex; align-items: center; justify-content: center;
            gap: 0.45rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .floating-copy-btn:active { transform: scale(0.9); background: var(--accent-hover); }
        .floating-copy-btn.copied {
            background: var(--success);
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        /* ─── Stats Mini ─── */
        .stats-mini {
            display: flex; justify-content: space-between;
            font-size: 0.8rem; color: var(--text-secondary);
            padding: 0 0.5rem;
        }
        .stats-mini span strong { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

        /* ─── Clipboard Warning ─── */
        .clipboard-warning-banner {
            display: none;
            background: #fff8e6;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            align-items: flex-start; gap: 0.6rem;
            margin-top: 0.5rem;
        }
        .clipboard-warning-banner.show { display: flex; }
        .clipboard-warning-banner .icon { color: var(--warning); font-size: 1rem; margin-top: 0.1rem; }
        .banner-text { font-size: 0.8rem; color: #8a6a1c; line-height: 1.5; }
        .banner-text strong { color: #5c450e; }

        /* ─── Toast ─── */
        .toast {
            position: fixed; top: 2rem; left: 50%;
            transform: translate(-50%, -100px);
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: 600; font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            display: flex; align-items: center; gap: 0.6rem;
            color: white;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }

        @media (max-width: 420px) {
            body { padding: 1rem 0.75rem 3rem; }
            .card { padding: 1rem; border-radius: 16px; }
            #outputText { padding-right: 1rem; padding-bottom: 4rem; }
            .floating-copy-btn { width: calc(100% - 24px); }
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-icon"><span class="icon" aria-hidden="true">✦</span></div>
            <h1>格式转换器</h1>
            <p class="subtitle">极致纯净 · 全自动化</p>
        </header>

        <div style="display: flex; justify-content: center; margin-bottom: 0.5rem;">
            <a href="index.html" class="nav-link">
                <span class="icon" aria-hidden="true">⌂</span> 返回主页
            </a>
        </div>

        <div class="card">
            <div class="section-title">
                <div class="label">
                    <span class="icon" style="color: var(--text-secondary);" aria-hidden="true">▣</span> 粘贴源数据
                </div>
                <div id="modeBadge" class="mode-badge">
                    <span class="icon" aria-hidden="true">↯</span> <span id="modeText">智能识别</span>
                </div>
            </div>
            
            <div class="input-wrapper">
                <textarea id="inputText" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="请在此粘贴需要转换的内容...&#10;&#10;自动提取账号、密码、可选辅助邮箱和2FA。&#10;没有辅助邮箱时会自动跳过；已是 --- 格式也会自动清洗。" oninput="handleInput()"></textarea>
                <button class="clear-btn" type="button" onclick="clearAll()" title="清空" aria-label="清空">
                    <span class="icon" aria-hidden="true">×</span>
                </button>
            </div>
            <div class="stats-mini">
                <span id="inputStats">有效行: <strong>0</strong></span>
            </div>
        </div>

        <div class="card" id="outputPanel" style="display: none;">
            <div class="section-title">
                <div class="label" style="color: var(--success);">
                    <span class="icon" aria-hidden="true">✓</span> 转换结果
                </div>
            </div>

            <div class="output-wrapper">
                <textarea id="outputText" readonly spellcheck="false"></textarea>
                <!-- 悬浮一键复制按钮 -->
                <button class="floating-copy-btn" id="copyBtn" type="button" onclick="executeCopy()" aria-label="复制转换结果">
                    <span class="icon" id="copyIcon" aria-hidden="true">⧉</span>
                    <span id="copyText">复制</span>
                </button>
            </div>

            <div class="stats-mini">
                <span id="outputStats">成功: <strong>0</strong> 行</span>
                <span id="skipStats">忽略: <strong>0</strong> 行</span>
            </div>

            <div id="copyWarningBanner" class="clipboard-warning-banner">
                <span class="icon" aria-hidden="true">i</span>
                <div class="banner-text">
                    由于浏览器限制未能自动复制，已为您<strong>全选文字</strong>，请长按文本框点击<strong>「拷贝」</strong>。
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const outputPanel = document.getElementById('outputPanel');
        const modeBadge = document.getElementById('modeBadge');
        const modeText = document.getElementById('modeText');
        const toast = document.getElementById('toast');
        let toastTimer = null;
        const EMAIL_REGEX_SOURCE = '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}';
        const HARD_DELIMITERS = ['|', '\t', ',', ';', '，', '；'];
        const ACCOUNT_LABELS = ['登录账号', '账号', '账户', '邮箱', 'email', 'mail', 'login', 'username', 'user'];
        const PASSWORD_LABELS = ['登录密码', '密码', 'password', 'passwd', 'pass', 'pwd'];
        const RECOVERY_LABELS = ['辅助邮箱', '辅助邮件', '恢复邮箱', '恢复邮件', '备用邮箱', '密保邮箱', 'recovery email', 'recovery mail', 'recovery'];
        const TWO_FACTOR_LABELS = ['google authenticator', 'authenticator', 'two factor', '2fa', 'totp', 'otp', '谷歌验证码', '谷歌验证', '谷歌密钥', '验证密钥', '动态密钥', '两步验证', '二步验证', '2步验证', '验证码', '密钥'];
        const TWO_FACTOR_CHANGE_PATTERN = /2fa\s*修改成功/i;
        const ALL_FIELD_LABELS = ACCOUNT_LABELS.concat(PASSWORD_LABELS, RECOVERY_LABELS, TWO_FACTOR_LABELS);
        const ALL_FIELD_LABEL_PATTERN = ALL_FIELD_LABELS
            .slice()
            .sort((a, b) => b.length - a.length)
            .map(escapeRegex)
            .join('|');
        const CREDENTIAL_NOISE_PATTERNS = [
            /(?:^|\s+)\d{4}[-/年]\d{1,2}[-/月]\d{1,2}/,
            /(?:^|\s+)\d{1,2}:\d{2}(?::\d{2})?/,
            /(?:^|\s+)(?:\S*验证成功|已经|已|账号凭证|凭证|获取成功|订阅|成功|失败|日志)/,
            /(?:^|[|,\s])https?:\/\//i,
            /[?&](?:token|secret|api[_-]?key|apikey)=/i,
            /\s*[{\[]\s*["']?(?:client_id|client_secret|token)/i,
            /(?:^|\s+)(?:johnson|json)\s+(?:token|client_id|client_secret)\b/i,
            /(?:^|\s+)(?:json|token|client_id|client_secret)\b(?=\s*[:：={])/i,
        ];

        // 触觉反馈辅助函数
        function triggerHaptic(type = 'light') {
            if (navigator.vibrate) {
                if (type === 'light') navigator.vibrate([20]);
                if (type === 'success') navigator.vibrate([30, 20, 30]);
                if (type === 'clear') navigator.vibrate([15, 15]);
            }
        }

        // 实时输入处理
        function handleInput() {
            const text = normalizeCredentialInput(inputText.value);
            const lines = text.split(/\r?\n|\r/);
            const effectiveLines = lines.filter(line => line.trim()).length;
            document.getElementById('inputStats').innerHTML = `有效行: <strong>${effectiveLines}</strong>`;
            
            if (!text.trim()) {
                outputText.value = '';
                outputPanel.style.display = 'none';
                modeBadge.classList.remove('show');
                document.getElementById('copyWarningBanner').classList.remove('show');
                return;
            }

            triggerHaptic('light');

            // 更新徽章
            modeBadge.classList.add('show');
            modeText.innerText = "智能提纯过滤";
            modeBadge.style.color = "var(--accent)";
            modeBadge.style.background = "#e6f2fd";

            // 转换逻辑
            const convertedLines = [];
            let skippedCount = 0;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) { skippedCount++; return; }

                const isChangedTwoFactorReceipt = TWO_FACTOR_CHANGE_PATTERN.test(trimmed);
                const convertedLine = isChangedTwoFactorReceipt
                    ? ''
                    : cleanConvertedCredentialLine(trimmed);
                const credential = convertedLine ? null : extractCredential(trimmed);

                if (convertedLine) {
                    convertedLines.push(convertedLine);
                } else if (credential) {
                    convertedLines.push(formatCredential(credential));
                } else {
                    skippedCount++;
                }
            });

            if (convertedLines.length > 0) {
                outputText.value = convertedLines.join('\n');
                document.getElementById('outputStats').innerHTML = `成功: <strong style="color:var(--success);">${convertedLines.length}</strong> 行`;
                document.getElementById('skipStats').innerHTML = `忽略: <strong>${skippedCount}</strong> 行`;
                outputPanel.style.display = 'flex';
                document.getElementById('copyWarningBanner').classList.remove('show');
            } else {
                outputPanel.style.display = 'none';
            }
        }

        function normalizeCredentialInput(text) {
            const markerJoinedText = text.replace(
                /(2fa\s*修改成功\s*[：:]?)[ \t]*(?:\r\n|\r|\n)[ \t]*/gi,
                '$1 ',
            );
            const physicalLines = markerJoinedText.split(/\r?\n|\r/);
            const logicalLines = [];

            physicalLines.forEach(line => {
                const marker = line.match(TWO_FACTOR_CHANGE_PATTERN);
                const beforeMarker = marker ? line.slice(0, marker.index) : '';
                let previousIndex = logicalLines.length - 1;

                while (previousIndex >= 0 && !logicalLines[previousIndex].trim()) {
                    previousIndex--;
                }

                const previousLine = previousIndex >= 0 ? logicalLines[previousIndex] : '';
                const shouldJoinPrevious = marker
                    && !extractEmails(beforeMarker).length
                    && Boolean(extractCredentialIdentity(previousLine));

                if (shouldJoinPrevious) {
                    logicalLines[previousIndex] = `${previousLine.trim()} ${line.trim()}`;
                } else {
                    logicalLines.push(line);
                }
            });

            return logicalLines.join('\n');
        }

        function escapeRegex(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function extractCredential(line) {
            const cleaned = line.trim().replace(/^\uFEFF/, '');
            const changeMarker = cleaned.match(TWO_FACTOR_CHANGE_PATTERN);
            if (changeMarker) {
                return extractChangedTwoFactorCredential(cleaned, changeMarker);
            }

            return extractStandardCredential(cleaned);
        }

        function extractChangedTwoFactorCredential(line, changeMarker) {
            const originalText = line.slice(0, changeMarker.index).trim();
            const changedText = line.slice(changeMarker.index + changeMarker[0].length).trim();
            const original = extractCredentialIdentity(originalText);
            const changed = extractStandardCredential(changedText);

            if (!original || !changed) return null;
            if (original.account.toLowerCase() !== changed.account.toLowerCase()) return null;
            if (original.password !== changed.password) return null;

            return {
                account: original.account,
                password: original.password,
                recovery: original.recovery,
                twoFactor: changed.twoFactor,
            };
        }

        function extractStandardCredential(line) {
            const cleaned = line.trim().replace(/^\uFEFF/, '');
            const identity = extractCredentialIdentity(cleaned);
            if (!identity) return null;

            const labeledTwoFactor = extractLabeledValue(cleaned, TWO_FACTOR_LABELS);
            const twoFactor = normalizeTwoFactor(extractTwoFactorSecret(labeledTwoFactor))
                || findTwoFactor(
                    cleaned,
                    identity.hardFields,
                    identity.account,
                    identity.password,
                    identity.recovery,
                    identity.passwordInfo.index,
                );

            if (!twoFactor) return null;

            return {
                account: identity.account,
                password: identity.password,
                recovery: identity.recovery,
                twoFactor,
            };
        }

        function extractCredentialIdentity(line) {
            const cleaned = line.trim().replace(/^\uFEFF/, '');
            const hardFields = splitHardDelimitedLine(cleaned);
            const fields = hardFields || splitForwardLine(cleaned);

            const labeledAccount = extractLabeledValue(cleaned, ACCOUNT_LABELS);
            const labeledPassword = extractLabeledValue(cleaned, PASSWORD_LABELS);
            const labeledRecovery = extractLabeledValue(cleaned, RECOVERY_LABELS);

            const account = normalizeAccount(labeledAccount) || findAccount(cleaned, fields);
            const labeledPasswordValue = normalizePassword(labeledPassword, true);
            const passwordInfo = labeledPasswordValue
                ? { value: labeledPasswordValue, index: -1 }
                : findPassword(cleaned, fields, account, Boolean(hardFields));
            const password = passwordInfo.value;

            const recovery = normalizeRecovery(labeledRecovery)
                || findRecovery(fields, account, passwordInfo.index);

            if (!account || !password) return null;

            return {
                account,
                password,
                recovery,
                hardFields,
                passwordInfo,
            };
        }

        function formatCredential(credential) {
            const parts = [credential.account, credential.password];
            if (credential.recovery) parts.push(credential.recovery);
            parts.push(credential.twoFactor);
            return parts.join('---');
        }

        function cleanConvertedCredentialLine(line) {
            const parts = line.split('---').map(part => part.trim()).filter(Boolean);
            if (parts.length < 3) return '';

            const account = normalizeAccount(parts[0]);
            const password = normalizePassword(parts[1], true);
            if (!account || !password) return '';

            const possibleRecovery = normalizeRecovery(parts[2]);
            const hasRecovery = possibleRecovery && possibleRecovery.toLowerCase() !== account.toLowerCase();
            const recovery = hasRecovery ? possibleRecovery : '';
            const twoFactorSource = (hasRecovery ? parts.slice(3) : parts.slice(2)).join(' ');
            const twoFactor = normalizeTwoFactor(extractTwoFactorSecret(twoFactorSource, false));
            if (!twoFactor) return '';

            return formatCredential({ account, password, recovery, twoFactor });
        }

        function splitHardDelimitedLine(line) {
            const trimmed = line.trim().replace(/^\uFEFF/, '');
            const tripleDashFields = splitExactDashDelimitedLine(trimmed, 3);
            if (tripleDashFields) return tripleDashFields;

            const doubleDashFields = splitExactDashDelimitedLine(trimmed, 2);
            if (doubleDashFields) return doubleDashFields;

            const selectedDelimiter = HARD_DELIMITERS.find(delimiter => trimmed.includes(delimiter));

            if (!selectedDelimiter) return null;
            return trimmed.split(selectedDelimiter).map(part => cleanFieldValue(part));
        }

        function splitExactDashDelimitedLine(line, dashCount) {
            const fields = [];
            let fieldStart = 0;
            const delimiter = '-'.repeat(dashCount);

            for (let index = 0; index <= line.length - dashCount; index++) {
                const isExactDelimiter = line.slice(index, index + dashCount) === delimiter
                    && line[index - 1] !== '-'
                    && line[index + dashCount] !== '-';

                if (!isExactDelimiter) continue;

                fields.push(cleanFieldValue(line.slice(fieldStart, index)));
                fieldStart = index + dashCount;
                index += dashCount - 1;
            }

            if (!fields.length) return null;
            fields.push(cleanFieldValue(line.slice(fieldStart)));
            return fields;
        }

        function splitForwardLine(line) {
            const trimmed = line.trim().replace(/^\uFEFF/, '');
            const hardFields = splitHardDelimitedLine(trimmed);
            if (hardFields) return hardFields;
            return trimmed.split(/\s+/).map(part => cleanFieldValue(part)).filter(Boolean);
        }

        function extractLabeledValue(line, labels) {
            const labelPattern = labels
                .slice()
                .sort((a, b) => b.length - a.length)
                .map(escapeRegex)
                .join('|');
            const matcher = new RegExp(
                `(?:^|[\\s|,;，；\\[{(])(?:${labelPattern})\\s*[:：=]\\s*([\\s\\S]*?)(?=\\s+(?:${ALL_FIELD_LABEL_PATTERN})\\s*[:：=]|[|,;，；\\n]|$)`,
                'i'
            );
            const match = line.match(matcher);
            return match ? cleanFieldValue(match[1]) : '';
        }

        function cleanFieldValue(value) {
            if (!value) return '';
            return value
                .trim()
                .replace(/^["'“”‘’`]+|["'“”‘’`]+$/g, '')
                .replace(new RegExp(`^(?:${ALL_FIELD_LABEL_PATTERN})\\s*[:：=]\\s*`, 'i'), '')
                .trim();
        }

        function trimToken(value) {
            return cleanFieldValue(value)
                .replace(/^[\s"'“”‘’`<[{(]+|[\s"'“”‘’`>\]}).,，;；]+$/g, '')
                .trim();
        }

        function extractEmails(value) {
            return value.match(new RegExp(EMAIL_REGEX_SOURCE, 'gi')) || [];
        }

        function normalizeAccount(value) {
            const email = extractEmails(value)[0];
            if (email) return email;

            const token = trimToken(value).match(/[^\s|,;，；]+/)?.[0] || '';
            return token && !looksLikeNoiseToken(token) ? token : '';
        }

        function normalizeRecovery(value) {
            return extractEmails(value)[0] || '';
        }

        function normalizePassword(value, allowEmailLike = false) {
            const token = cleanFieldValue(value).match(/[^\s|]+/)?.[0] || '';
            if (!token || (!allowEmailLike && extractEmails(token).length) || looksLikeNoiseToken(token)) return '';
            return token;
        }

        function normalizeTwoFactor(value) {
            return trimToken(value).replace(/\s+/g, ' ');
        }

        function findAccount(line, fields) {
            const email = extractEmails(line)[0];
            if (email) return email;

            for (const field of fields) {
                const account = normalizeAccount(field);
                if (account) return account;
            }

            return '';
        }

        function findPassword(line, fields, account, allowEmailAtExpectedPosition = false) {
            const accountIndex = findFieldIndex(fields, account);
            const startIndex = accountIndex >= 0 ? accountIndex + 1 : 0;

            for (let i = startIndex; i < fields.length; i++) {
                const password = normalizePassword(
                    fields[i],
                    allowEmailAtExpectedPosition && i === startIndex,
                );
                if (password) return { value: password, index: i };
            }

            if (account) {
                const afterAccount = textAfterValue(line, account);
                const token = (afterAccount.match(/[^\s|,;，；]+/g) || [])
                    .map(value => normalizePassword(value))
                    .find(Boolean);
                if (token) return { value: token, index: -1 };
            }

            return { value: '', index: -1 };
        }

        function findRecovery(fields, account, passwordIndex) {
            const startIndex = passwordIndex >= 0 ? passwordIndex + 1 : 0;
            const accountLower = (account || '').toLowerCase();

            for (let i = startIndex; i < fields.length; i++) {
                const email = extractEmails(fields[i]).find(item => item.toLowerCase() !== accountLower);
                if (email) return email;
                if (extractTwoFactorSecret(fields[i])) break;
            }

            return '';
        }

        function findTwoFactor(line, hardFields, account, password, recovery, passwordIndex) {
            if (hardFields) {
                const recoveryIndex = recovery ? findFieldIndex(hardFields, recovery) : -1;
                const startIndex = recoveryIndex >= 0
                    ? recoveryIndex + 1
                    : (passwordIndex >= 0 ? passwordIndex + 1 : 0);
                const value = hardFields.slice(startIndex).find(field => field.trim()) || '';
                return normalizeTwoFactor(extractTwoFactorSecret(value, false));
            }

            const anchor = recovery || password || account;
            const value = anchor ? textAfterValue(line, anchor) : line;
            return normalizeTwoFactor(extractTwoFactorSecret(value));
        }

        function findFieldIndex(fields, value) {
            if (!value) return -1;
            const lowerValue = value.toLowerCase();
            return fields.findIndex(field => field.toLowerCase().includes(lowerValue));
        }

        function textAfterValue(line, value) {
            const index = line.toLowerCase().indexOf(String(value).toLowerCase());
            if (index < 0) return '';
            return line.slice(index + String(value).length).replace(/^[\s|,;，；:\-=]+/, '').trim();
        }

        function extractTwoFactorSecret(value, allowShort = true) {
            if (!value) return '';

            let candidate = cleanFieldValue(value);
            const labeled = extractLabeledValue(candidate, TWO_FACTOR_LABELS);
            if (labeled) candidate = labeled;

            const uriSecret = extractOtpAuthSecret(candidate);
            if (uriSecret) return uriSecret;

            candidate = cutCredentialNoiseTail(candidate);
            const compactPattern = allowShort
                ? /^[A-Za-z0-9]{8,}\b/
                : /^[A-Za-z0-9]{16,}\b/;
            const compact = candidate.match(compactPattern);
            if (compact) return normalizeTwoFactor(compact[0]);

            if (!allowShort && /^(?:19|20)\d{2}(?:\b|[-/])/.test(candidate)) return '';

            const grouped = extractGroupedTwoFactor(candidate);
            if (grouped) return normalizeTwoFactor(grouped);

            if (!allowShort) return '';
            const shortToken = candidate.match(/^[A-Za-z0-9]{4,7}\b/);
            return shortToken ? normalizeTwoFactor(shortToken[0]) : '';
        }

        function extractGroupedTwoFactor(value) {
            const leadingRun = value.match(/^[A-Za-z0-9]{4}(?:[\s-]+[A-Za-z0-9]{4}){3,}/)?.[0] || '';
            if (!leadingRun) return '';

            const groups = leadingRun.match(/[A-Za-z0-9]{4}/g) || [];
            const earlyYearIndex = groups.findIndex((group, index) => (
                index >= 4
                && index < 8
                && /^(?:19|20)\d{2}$/.test(group)
            ));
            const groupCount = earlyYearIndex >= 0
                ? 4
                : Math.min(groups.length, 8);

            let searchFrom = 0;
            let endIndex = 0;
            groups.slice(0, groupCount).forEach(group => {
                const groupIndex = leadingRun.indexOf(group, searchFrom);
                endIndex = groupIndex + group.length;
                searchFrom = endIndex;
            });

            return leadingRun.slice(0, endIndex);
        }

        function extractOtpAuthSecret(value) {
            const otpAuthUri = value.match(/\botpauth:\/\/[^\s]+/i)?.[0] || '';
            if (!otpAuthUri) return '';

            const match = otpAuthUri.match(/[?&]secret=([^&#\s]+)/i);
            if (!match) return '';
            try {
                return decodeURIComponent(match[1]).replace(/\+/g, ' ').trim();
            } catch (e) {
                return match[1].trim();
            }
        }

        function cutCredentialNoiseTail(value) {
            let result = cleanFieldValue(value).replace(/\s+/g, ' ').trim();

            CREDENTIAL_NOISE_PATTERNS.forEach(pattern => {
                const match = result.match(pattern);
                if (match) {
                    result = result.slice(0, match.index).trim();
                }
            });

            return result;
        }

        function looksLikeNoiseToken(value) {
            return /^(?:\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}:\d{2}(?::\d{2})?|已经|已|账号凭证|凭证|获取成功|订阅|成功|失败)$/i.test(value);
        }

        function clearAll() {
            triggerHaptic('clear');
            inputText.value = '';
            outputText.value = '';
            outputPanel.style.display = 'none';
            modeBadge.classList.remove('show');
            modeText.innerText = '智能识别';
            document.getElementById('inputStats').innerHTML = `有效行: <strong>0</strong>`;
            document.getElementById('outputStats').innerHTML = `成功: <strong>0</strong> 行`;
            document.getElementById('skipStats').innerHTML = `忽略: <strong>0</strong> 行`;
            document.getElementById('copyWarningBanner').classList.remove('show');
            inputText.focus();
        }

        function showToast(message, type = 'success') {
            if (toastTimer) clearTimeout(toastTimer);
            toast.innerText = message;
            toast.style.background = type === 'success' ? 'rgba(52, 199, 89, 0.95)' : 'rgba(255, 59, 48, 0.95)';
            toast.className = 'toast show';
            toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2000);
        }

        function executeCopy() {
            const text = outputText.value;
            if (!text) return;

            triggerHaptic('success');
            
            const btn = document.getElementById('copyBtn');
            const icon = document.getElementById('copyIcon');
            const copyText = document.getElementById('copyText');
            btn.classList.add('copied');
            icon.innerText = '✓';
            copyText.innerText = '已复制';
            
            setTimeout(() => {
                btn.classList.remove('copied');
                icon.innerText = '⧉';
                copyText.innerText = '复制';
            }, 1500);

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('已复制');
                    }).catch(() => runFallbackCopy(text));
                    return;
                }
            } catch(e) {}
            
            runFallbackCopy(text);
        }

        function runFallbackCopy(text) {
            let success = false;
            try {
                outputText.focus();
                outputText.select();
                outputText.setSelectionRange(0, text.length);
                success = document.execCommand('copy');
            } catch(e) {}

            if (success) {
                showToast('已复制');
                setTimeout(() => { window.getSelection().removeAllRanges(); outputText.blur(); }, 500);
            } else {
                document.getElementById('copyWarningBanner').classList.add('show');
                showToast('请长按全选内容后拷贝', 'error');
            }
        }
    </script>
</body>
</html>
